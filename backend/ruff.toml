# Linter settings. `ruff check .` runs in CI on every push.
line-length = 110
target-version = "py313"
extend-exclude = ["alembic/versions"]  # generated migration files

[lint]
select = [
  "E", "W",  # pycodestyle: basic style
  "F",       # pyflakes: unused imports and variables, undefined names
  "I",       # import order
  "B",       # bugbear: likely bugs
  "UP",      # modern Python syntax
]
ignore = [
  "B008",  # FastAPI's Depends(...) in default arguments is the normal FastAPI pattern
]

[lint.isort]
# Our migrations folder is called "alembic" too; tell ruff the library is third-party.
known-third-party = ["alembic"]
