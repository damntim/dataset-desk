server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 26m;   # CSV uploads (the API itself caps at 25 MB)

    # /api/requests -> http://api:8000/requests  (the trailing "/" removes the /api prefix)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Built files have a content hash in their name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any other path (e.g. /requests/7) serves index.html,
    # and React Router shows the right page.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
